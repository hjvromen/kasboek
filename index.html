<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasboek</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2; --side:#efeee9; --surface:#fcfcfb; --surface-2:#f3f2ee; --hover:rgba(11,11,11,.05);
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --line:#e1e0d9; --line-strong:#c3c2b7;
  --accent:#2a78d6; --accent-ink:#fff; --accent-soft:#e3eefb;
  --neg:#b42318; --pos:#006300; --warn-bg:#fff4dc; --warn-ink:#6b4400; --warn-line:#f2d49a;
  --s1:#2a78d6; --s2:#eb6834; --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211; --side:#1a1a19; --surface:#1f1f1e; --surface-2:#262624; --hover:rgba(255,255,255,.06);
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#959389; --line:#2f2f2c; --line-strong:#45453f;
    --accent:#3987e5; --accent-ink:#fff; --accent-soft:#1d3047;
    --neg:#f07a7a; --pos:#4cc24c; --warn-bg:#3a2e14; --warn-ink:#f5d58e; --warn-line:#5a4720;
    --s1:#3987e5; --s2:#d95926; --grid:#2c2c2a; --axis:#45453f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --side:#1a1a19; --surface:#1f1f1e; --surface-2:#262624; --hover:rgba(255,255,255,.06);
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#959389; --line:#2f2f2c; --line-strong:#45453f;
  --accent:#3987e5; --accent-ink:#fff; --accent-soft:#1d3047;
  --neg:#f07a7a; --pos:#4cc24c; --warn-bg:#3a2e14; --warn-ink:#f5d58e; --warn-line:#5a4720;
  --s1:#3987e5; --s2:#d95926; --grid:#2c2c2a; --axis:#45453f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 20px;display:flex;flex-direction:column;gap:1px}
.brand{font-weight:700;font-size:19px;padding:6px 10px 14px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.brand svg{flex:none}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;min-height:36px}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--accent);color:var(--accent-ink)}
.nav.on .amt{color:var(--accent-ink)}
.nav svg{flex:none;opacity:.85}
.nav .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .amt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);white-space:nowrap;padding-left:8px}
.nav .amt.neg{color:var(--neg)}
.nav.on .amt.neg{color:var(--accent-ink)}
.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 10px 4px;font-weight:600}
.side .addacc{color:var(--accent);font-size:14px}
.side .foot{margin-top:auto;padding:16px 10px 0;font-size:12px;color:var(--muted)}
main{overflow:auto;min-width:0}
.page{max-width:1120px;margin:0 auto;padding:26px 30px 70px}
.page.wide{max-width:none}
h1{font-size:26px;margin:0;letter-spacing:-.015em;font-weight:700}
h2{font-size:17px;margin:0 0 12px;font-weight:650}
.sub{color:var(--ink-2);margin:4px 0 0}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head .grow{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:36px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{opacity:.45;cursor:default;filter:none}
.btn.danger{color:var(--neg);border-color:var(--line-strong)}
.btn.small{padding:4px 10px;min-height:30px;font-size:14px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px;min-height:0}
.btn.link:hover{text-decoration:underline;background:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.cards{display:grid;gap:16px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hero{font-size:34px;font-weight:700;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--ink-2)}
.tile .v{font-size:21px;font-weight:650;margin-top:2px}
.neg{color:var(--neg)}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-weight:400;font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.banner .grow{flex:1;min-width:200px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);background:var(--surface);position:sticky;top:0;z-index:1}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--hover)}
table.t tfoot td{font-weight:650;border-top:1px solid var(--line-strong);border-bottom:0}
table.t th.num{text-align:right}
.reg td.memo{color:var(--ink-2);font-size:13px;display:block;padding:0;border:0}
.reg .cat{color:var(--ink-2)}
.reg .st{width:34px;text-align:center}
.stbtn{border:1px solid transparent;background:none;border-radius:6px;width:26px;height:24px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.stbtn:hover{border-color:var(--line-strong)}
.stbtn.c{color:var(--accent)}
.stbtn.R{color:var(--ink);cursor:default}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
input[type=text],input[type=search],input[type=date],input:not([type]),select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:36px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.toolbar input,.toolbar select{width:auto}
.toolbar input[type=search]{min-width:220px}
label{display:block;font-size:14px;font-weight:550;margin-bottom:12px}
label>input,label>select,label>.row{margin-top:4px}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;padding:2px;margin-bottom:14px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);border:1px solid var(--line)}
.modal.wide{width:min(760px,100%)}
.modal-head{display:flex;align-items:center;padding:16px 20px 4px}
.modal-head h2{margin:0;flex:1}
.modal-body{padding:12px 20px 18px}
.modal-actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.spacer{flex:1}
.icon-btn{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:8px}
.icon-btn:hover{background:var(--hover)}
.err{color:var(--neg);font-size:14px;min-height:0}
.err:not(:empty){margin:4px 0 10px}
.splits{width:100%;border-collapse:collapse;margin:4px 0 6px}
.splits td{padding:3px 4px 3px 0}
.splits select{min-width:0}
.splits .amt input{width:110px;text-align:right}
.xfer-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-bottom:12px}
.xfer-row label{margin:0}
.xfer-row .btn{margin-bottom:2px}
.ywrap{overflow-x:auto;margin:0 -6px}
.yt{font-size:12.5px;font-variant-numeric:tabular-nums}
.yt th,.yt td{padding:6px 4px;white-space:nowrap}
.yt .lbl{min-width:130px;padding-right:10px}
.yt .lbl{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.yt thead .lbl{z-index:2}
.yt tr.sect td{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:16px;border-bottom:1px solid var(--line-strong)}
.yt tr.grp td{font-weight:600}
.yt tr.sub td{font-weight:650;border-top:1px solid var(--line-strong);background:var(--surface-2)}
.yt tr.sub .lbl,.yt tr.net .lbl{background:var(--surface-2)}
.yt tr.net td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-strong)}
.yt td.tot{font-weight:600;border-left:1px solid var(--line)}
.yt td.yc{cursor:pointer}
.yt td.yc:hover{background:var(--hover)}
@media print{.ywrap{overflow:visible}.yt{min-width:0;font-size:8.5pt}.yt th,.yt td{padding:3px 4px}.no-print{display:none}}
.splitsum{font-size:14px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.hbars{display:flex;flex-direction:column;gap:2px}
.hbar{display:grid;grid-template-columns:minmax(90px,200px) minmax(40px,1fr) auto 40px;gap:12px;align-items:center;border:0;background:none;padding:6px 6px;border-radius:7px;text-align:left;cursor:default;width:100%}
.hbar.drill{cursor:pointer}
.hbar.drill:hover{background:var(--hover)}
.hb-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{display:block;height:14px;position:relative}
.hb-fill{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hb-val{text-align:right;font-variant-numeric:tabular-nums}
.hb-pct{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
#tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:13px;z-index:100;display:none;max-width:260px;line-height:1.5}
#tip b{font-weight:650}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink-2);margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.crumbs{font-size:14px;margin-bottom:10px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:200;box-shadow:var(--shadow);font-size:14px}
.recon{position:sticky;top:0;z-index:3;background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.recon .k{font-size:12px;color:var(--ink-2)}
.recon .v{font-weight:650;font-variant-numeric:tabular-nums}
.welcome{max-width:640px;margin:8vh auto 0;text-align:center}
.welcome .big{display:grid;gap:12px;margin-top:26px;text-align:left}
.bigbtn{display:block;width:100%;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:16px 18px;cursor:pointer}
.bigbtn:hover{border-color:var(--accent)}
.bigbtn b{display:block;font-size:16px;margin-bottom:2px}
.bigbtn span{color:var(--ink-2);font-size:14px}
.steps{padding-left:20px;margin:6px 0 0}
.steps li{margin-bottom:6px}
details summary{cursor:pointer;color:var(--accent)}
.catrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}
.catrow:hover{background:var(--hover)}
.catrow .nm{flex:1}
.catrow.child{padding-left:30px}
.catrow .acts{display:flex;gap:2px;opacity:.75}
.catrow:hover .acts{opacity:1}
.pill{font-size:12px;border-radius:20px;padding:1px 8px;background:var(--surface-2);color:var(--ink-2)}
.more{display:flex;justify-content:center;padding:14px}
.status-saved{font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100vh}
  .side{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:4px;align-items:center}
  .side h3,.side .foot,.side .brand span.t{display:none}
  .brand{padding:0 6px}
  .nav{width:auto;flex:none}
  .nav .amt{display:none}
  .page{padding:18px 14px 60px}
  .cols2,.tiles,.grid2{grid-template-columns:1fr}
  .hbar{grid-template-columns:110px 1fr 96px}
  .hb-pct{display:none}
  .reg .memo-col,.reg .numcol{display:none}
}
@media print{
  .side,.toolbar,.btn,.tabs,.no-print{display:none!important}
  .app{display:block;height:auto}
  main{overflow:visible}
  body{background:#fff}
  .card{border:0;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div id="tip"></div>
<datalist id="payee-list"></datalist>
<input type="file" id="file-backup" accept=".json,application/json" hidden>
<input type="file" id="file-qif" accept=".qif,.QIF,text/plain" multiple hidden>

<script>
"use strict";
/* ===================================================================
   Kasboek — a personal money manager that runs in your browser.
   All data stays on this computer (browser storage + backup files).
   =================================================================== */

const APP_VERSION = '1.6 (oktober 2026)';

/* ---------- installable app (when opened from its web address) ---------- */
const IS_WEB = /^https?:$/.test(location.protocol);
let swReg = null, updateReady = null;
const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
/* Look on the web address for a newer Kasboek and offer it. */
let lastUpdateCheck = 0;
async function checkForUpdate() {
  if (!IS_WEB || !navigator.onLine || Date.now() - lastUpdateCheck < 5 * 60000) return;
  lastUpdateCheck = Date.now();
  try {
    if (swReg) swReg.update().catch(() => {});
    const r = await fetch('index.html?check=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION && m[1] !== updateReady) { updateReady = m[1]; if (typeof render === 'function') render(); }
  } catch (e) {}
}
async function applyUpdate() {
  try { if ('caches' in window) for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  try { if (swReg) await swReg.update(); } catch (e) {}
  location.reload();
}
let installPrompt = null;
const isInstalledApp = () => window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches);
if (IS_WEB) {
  for (const [rel, href] of [['manifest', 'manifest.webmanifest'], ['icon', 'favicon-32.png'], ['apple-touch-icon', 'apple-touch-icon.png']]) {
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  }
  const tc = document.createElement('meta'); tc.name = 'theme-color'; tc.content = '#2a78d6'; document.head.appendChild(tc);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
    // when a new version of the offline helper takes over, load the new program once
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded && hadController && !modalStack.length) { reloaded = true; location.reload(); } });
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (typeof render === 'function' && state && (state.view === 'settings' || state.view === 'home')) render(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; toast('Kasboek is geïnstalleerd. Open het voortaan vanuit het Dock of het Startmenu.'); render(); });
}
async function installApp() {
  if (!installPrompt) return;
  installPrompt.prompt();
  try { await installPrompt.userChoice; } catch (e) {}
  installPrompt = null; render();
}

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const isoOf = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);

const ACCOUNT_TYPES = [
  ['checking', 'Betaalrekening'],
  ['savings', 'Spaarrekening'],
  ['credit', 'Creditcard'],
  ['cash', 'Contant geld'],
  ['asset', 'Overige bezitting (huis, auto…)'],
  ['liability', 'Lening / hypotheek / overige schuld'],
];
const ACCOUNT_GROUPS = [
  ['Bank en contant', ['checking', 'savings', 'cash']],
  ['Creditcards', ['credit']],
  ['Bezittingen', ['asset']],
  ['Leningen en schulden', ['liability']],
];
const isDebtType = t => t === 'credit' || t === 'liability';

/* ---------- the data ---------- */
function emptyDB() {
  return {
    app: 'kasboek', version: 1,
    settings: { currency: 'EUR', locale: 'nl-NL', theme: 'system' },
    accounts: [], categories: [], transactions: [],
    seq: 1, lastBackup: null,
  };
}
let DB = emptyDB();
let _idx = null;

function cmpTx(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq; }

function idx() {
  if (_idx) return _idx;
  const acc = new Map(DB.accounts.map(a => [a.id, a]));
  const cat = new Map(DB.categories.map(c => [c.id, c]));
  const tx = new Map(DB.transactions.map(t => [t.id, t]));
  const byAcc = new Map(DB.accounts.map(a => [a.id, []]));
  const legsOf = new Map();
  for (const t of DB.transactions) {
    if (!byAcc.has(t.accountId)) byAcc.set(t.accountId, []);
    byAcc.get(t.accountId).push(t);
    if (t.linkId) { if (!legsOf.has(t.linkId)) legsOf.set(t.linkId, []); legsOf.get(t.linkId).push(t); }
  }
  const bal = new Map();
  for (const [id, arr] of byAcc) { arr.sort(cmpTx); bal.set(id, arr.reduce((s, t) => s + t.amount, 0)); }
  // last transaction per payee (for auto-fill)
  const payeeLast = new Map();
  const sources = DB.transactions.filter(t => !t.linkId && !t.ob && t.payee).sort(cmpTx);
  for (const t of sources) payeeLast.set(t.payee.toLowerCase(), t);
  const childrenOf = new Map();
  for (const c of DB.categories) if (c.parentId) { if (!childrenOf.has(c.parentId)) childrenOf.set(c.parentId, []); childrenOf.get(c.parentId).push(c); }
  for (const arr of childrenOf.values()) arr.sort((a, b) => a.name.localeCompare(b.name));
  _idx = { acc, cat, tx, byAcc, legsOf, bal, payeeLast, childrenOf };
  return _idx;
}
function changed() { _idx = null; scheduleSave(); }

/* ---------- formatting ---------- */

  for (const [kind, label] of [['expense', 'Uitgaven'], ['income', 'Inkomsten']]) {
    const tops = sortedTopCats(kind);
    if (!tops.length) continue;
    h += `<optgroup label="${label}">`;
    for (const t of tops) {
      h += `<option value="c:${t.id}" ${selected === 'c:' + t.id ? 'selected' : ''}>${esc(t.name)}</option>`;
      for (const s of (I.childrenOf.get(t.id) || [])) h += `<option value="c:${s.id}" ${selected === 'c:' + s.id ? 'selected' : ''}>    ${esc(t.name)} : ${esc(s.name)}</option>`;
    }
    h += `</optgroup>`;
  }
  if (!opts.noTransfers) {
    const accs = DB.accounts.filter(a => a.id !== excludeAccountId && (!a.closed || selected === 't:' + a.id));
    if (accs.length) {
      h += `<optgroup label="Overboeken naar / van rekening">`;
      for (const a of accs) h += `<option value="t:${a.id}" ${selected === 't:' + a.id ? 'selected' : ''}>↔ ${esc(a.name)}</option>`;
      h += `</optgroup>`;
    }
  }
  if (!opts.noNew) h += `<option value="__new">+ Nieuwe categorie…</option>`;
  return h;
}

/* ---------- transactions & transfers ---------- */
function newTx(fields) { const t = Object.assign({ id: uid(), seq: DB.seq++, payee: '', memo: '', num: '', status: '', categoryId: null, transferAccountId: null, splits: null }, fields); DB.transactions.push(t); return t; }

/* A transfer is stored once (the "source") in one account; the other side(s) are
   automatically maintained "legs" in the other account(s). */
function syncLegs(src) {
  const want = [];
  if (src.splits && src.splits.length) {
    src.splits.forEach((s, i) => { if (s.transferAccountId && s.transferAccountId !== src.accountId) want.push({ k: i, acc: s.transferAccountId, amt: -s.amount, memo: s.memo || src.memo }); });
  } else if (src.transferAccountId && src.transferAccountId !== src.accountId) {
    want.push({ k: -1, acc: src.transferAccountId, amt: -src.amount, memo: src.memo });
  }
  const existing = DB.transactions.filter(t => t.linkId === src.id);
  const keep = new Set();
  for (const w of want) {
    let leg = existing.find(l => l.linkKey === w.k && !keep.has(l.id)) || existing.find(l => l.accountId === w.acc && !keep.has(l.id));
    if (!leg) leg = newTx({ linkId: src.id, status: '' });
    keep.add(leg.id);
    if (leg.accountId && leg.accountId !== w.acc) leg.status = '';
    Object.assign(leg, { linkKey: w.k, accountId: w.acc, date: src.date, amount: w.amt, payee: src.payee, memo: w.memo || '', transferAccountId: src.accountId, categoryId: null, splits: null });
  }
  if (existing.some(l => !keep.has(l.id))) DB.transactions = DB.transactions.filter(t => !(t.linkId === src.id && !keep.has(t.id)));
}
function deleteTx(src) {
  DB.transactions = DB.transactions.filter(t => t.id !== src.id && t.linkId !== src.id);
}
function txCategoryLabel(t) {
  const I = idx();
  if (t.ob) return '<span class="muted">Beginsaldo</span>';
  if (t.linkId) { const s = I.tx.get(t.linkId); const a = s && I.acc.get(s.accountId); return '↔ ' + esc(a ? a.name : 'andere rekening'); }
  if (t.splits && t.splits.length) return `Gesplitst (${t.splits.length} regels)`;
  if (t.transferAccountId) { const a = I.acc.get(t.transferAccountId); return '↔ ' + esc(a ? a.name : 'andere rekening'); }
  if (t.categoryId) return esc(catName(t.categoryId));
  return '<span class="muted">Zonder categorie</span>';
}
function txCategoryText(t) { const d = document.createElement('div'); d.innerHTML = txCategoryLabel(t); return d.textContent; }
function accName(id) { const a = idx().acc.get(id); return a ? a.name : ''; }

function categoryFlows(from, to, accountId) {
  const flows = new Map();
  const add = (k, v) => flows.set(k, (flows.get(k) || 0) + v);
  for (const t of DB.transactions) {
    if (t.linkId || t.ob || t.date < from || t.date > to) continue;
    if (accountId && accountId !== 'all' && t.accountId !== accountId) continue;
    if (t.splits && t.splits.length) {
      for (const s of t.splits) { if (s.transferAccountId) continue; add(s.categoryId || (s.amount > 0 ? '_in' : '_out'), s.amount); }
    } else if (!t.transferAccountId) add(t.categoryId || (t.amount > 0 ? '_in' : '_out'), t.amount);
  }
  return flows;
}
function sumByKind(flows) {
  let income = 0, expense = 0;
  for (const [k, v] of flows) { if (catKind(k) === 'income') income += v; else expense -= v; }
  return { income, expense };
}

function exportRegisterCSV() {
  const I = idx(), a = I.acc.get(state.accountId); if (!a) return;

  const [from, to] = periodRange(regState.period, regState.custom);
  for (const t of all) {
    run += t.amount;
    if (t.date < from || t.date > to) continue;
    rows.push([fmtDate(t.date), t.num, t.payee, txCategoryText(t), t.memo, t.status, moneyPlain(t.amount), moneyPlain(run)]);
  }
  downloadCSV(a.name + ' ' + todayISO() + '.csv', rows);
}
function downloadCSV(name, rows) {
  const sep = localeDecimal() === ',' ? ';' : ',';
  const q = v => { v = String(v == null ? '' : v); return (v.includes(sep) || /["\n]/.test(v)) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  download(name, '﻿' + rows.map(r => r.map(q).join(sep)).join('\r\n'), 'text/csv');
}

  w.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(w); });
  modalStack.push(w);
  setTimeout(() => { const f = w.querySelector('[autofocus]') || w.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); if (f) f.focus(); }, 30);
  return w;
}
function closeModal(w) { w.remove(); modalStack = modalStack.filter(x => x !== w); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalStack.length) closeModal(modalStack[modalStack.length - 1]); });
function confirmBox(title, html, okLabel, danger) {
  return new Promise(res => {
    const w = openModal({ title: esc(title), body: `<div>${html}</div><div class="modal-actions"><span class="spacer"></span><button class="btn" data-no>Annuleren</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(okLabel || 'OK')}</button></div>` });
    $('[data-yes]', w).onclick = () => { closeModal(w); res(true); };
    $('[data-no]', w).onclick = () => { closeModal(w); res(false); };
    $('.icon-btn', w).addEventListener('click', () => res(false));
    setTimeout(() => $('[data-yes]', w).focus(), 40);
  });
}
function alertBox(title, html) {
  const w = openModal({ title: esc(title), body: `<div>${html}</div><div class="modal-actions"><span class="spacer"></span><button class="btn primary" data-close>OK</button></div>` });
  setTimeout(() => $('.btn.primary', w).focus(), 40);
}
function promptBox(title, label, value, hint) {
  return new Promise(res => {
    const w = openModal({ title: esc(title), body: `<form><label>${esc(label)}${hint ? ` <span class="hint">${esc(hint)}</span>` : ''}<input name="v" value="${esc(value || '')}" autofocus></label><div class="modal-actions"><span class="spacer"></span><button type="button" class="btn" data-no>Annuleren</button><button class="btn primary">OK</button></div></form>` });
    const f = $('form', w);
    f.onsubmit = e => { e.preventDefault(); const v = f.v.value.trim(); closeModal(w); res(v || null); };
    $('[data-no]', w).onclick = () => { closeModal(w); res(null); };
    $('.icon-btn', w).addEventListener('click', () => res(null));
  });
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ---------- Transaction editor ---------- */
function openTxEditor(tx, accountId, startType) {
  const I = idx();
  const fromLeg = tx && tx.linkId;
  const src = tx ? (tx.linkId ? I.tx.get(tx.linkId) : tx) : null;
  const isNew = !src;
  const acctId = src ? src.accountId : accountId;
  const viewAcc = tx ? tx.accountId : accountId;   // the account the person is looking at
  const acc = I.acc.get(acctId);
  if (!acc) return;
  const d = src ? JSON.parse(JSON.stringify(src)) : { date: lastEnteredDate || todayISO(), amount: null, payee: '', memo: '', num: '', status: '', categoryId: null, transferAccountId: null, splits: null };
  let type = (d.amount != null && d.amount > 0) ? 'dep' : 'pay';
  let curSel = d.transferAccountId ? 't:' + d.transferAccountId : d.categoryId ? 'c:' + d.categoryId : '';
  // transfer ("overboeking"): money goes from one account to another
  let xferFrom = viewAcc, xferTo = (DB.accounts.find(a => a.id !== viewAcc && !a.closed) || {}).id || '';
  if (src && !d.ob && d.transferAccountId && !(d.splits && d.splits.length)) {
    type = 'xfer'; curSel = '';
    xferFrom = d.amount < 0 ? src.accountId : d.transferAccountId;
    xferTo = d.amount < 0 ? d.transferAccountId : src.accountId;
  }
  if (!src && startType) type = startType;
  const sgn = () => type === 'dep' ? 1 : -1;
  let splits = (d.splits && d.splits.length) ? d.splits.map(s => ({ sel: s.transferAccountId ? 't:' + s.transferAccountId : s.categoryId ? 'c:' + s.categoryId : '', memo: s.memo || '', amt: moneyPlain(s.amount * sgn()) })) : null;

  // refresh payee list
  $('#payee-list').innerHTML = Array.from(I.payeeLast.values()).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3000).map(t => `<option value="${esc(t.payee)}">`).join('');

  const body = `
    ${fromLeg && type !== 'xfer' ? `<div class="note">Dit is de andere kant van een overboeking die is ingevoerd bij <b>${esc(acc.name)}</b>. Hij wordt hier getoond zoals hij bij ${esc(acc.name)} staat; wijzigingen gelden voor beide rekeningen.</div>` : ''}
    ${d.ob ? `<div class="note">Dit is het beginsaldo van de rekening.</div>` : ''}
    <form id="txf" autocomplete="off">
      <div class="seg"><button type="button" data-type="pay">Uitgave (af)</button><button type="button" data-type="dep">Ontvangst (bij)</button>${d.ob ? '' : '<button type="button" data-type="xfer">Overboeking (tussen rekeningen)</button>'}</div>
      <div class="grid2">
        <label>Datum<input type="date" name="date" value="${esc(d.date)}" required></label>
        <label>Nummer <span class="hint">optioneel (kenmerk, referentie)</span><input name="num" value="${esc(d.num)}"></label>
      </div>
      <div id="xfer-area"></div>
      <label><span id="payee-label">Begunstigde</span><input name="payee" list="payee-list" value="${esc(d.payee)}" ${isNew ? 'autofocus' : ''} placeholder="Aan wie betaalde u, of wie betaalde u?"></label>
      <label>Bedrag<input name="amount" inputmode="decimal" value="${d.amount != null ? esc(moneyPlain(Math.abs(d.amount))) : ''}" placeholder="0${localeDecimal()}00"></label>
      <div id="cat-area"></div>
      <label>Notitie <span class="hint">optioneel</span><input name="memo" value="${esc(d.memo)}"></label>
      <label>Status<select name="status">
        <option value="" ${!d.status ? 'selected' : ''}>Nog niet verwerkt</option>
        <option value="c" ${d.status === 'c' ? 'selected' : ''}>Verwerkt door de bank (staat op het afschrift)</option>
        <option value="R" ${d.status === 'R' ? 'selected' : ''}>Afgestemd</option></select></label>
      <div class="err" id="txerr"></div>
      <div class="modal-actions">
        ${!isNew ? '<button type="button" class="btn danger" data-del>Verwijderen</button>' : ''}
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Annuleren</button>
        ${isNew ? '<button type="button" class="btn" data-savenew>Opslaan en volgende</button>' : ''}
        <button type="submit" class="btn primary">Opslaan</button>
      </div>
    </form>`;
  const w = openModal({ title: (isNew ? 'Nieuwe transactie' : 'Transactie wijzigen') + ' — ' + esc(accName(viewAcc) || acc.name), body, wide: true });
  const f = $('#txf', w);
  const err = $('#txerr', w);

  function accSelect(name, selected) {
    const accs = DB.accounts.filter(a => !a.closed || a.id === selected).sort((a, b) => a.name.localeCompare(b.name));
    return `<select name="${name}">${selected ? '' : '<option value="">— Kies een rekening —</option>'}${accs.map(a => `<option value="${a.id}" ${a.id === selected ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>`;
  }
  function renderXferArea() {
    const el = $('#xfer-area', w);
    if (type !== 'xfer') { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="xfer-row">
      <label>Van rekening${accSelect('xfrom', xferFrom)}</label>
      <button type="button" class="btn small" data-swap title="De twee rekeningen omwisselen" aria-label="De twee rekeningen omwisselen">⇄</button>
      <label>Naar rekening${accSelect('xto', xferTo)}</label></div>`;
    $('select[name=xfrom]', el).onchange = e => { xferFrom = e.target.value; };
    $('select[name=xto]', el).onchange = e => { xferTo = e.target.value; };
    $('[data-swap]', el).onclick = () => { [xferFrom, xferTo] = [xferTo, xferFrom]; renderXferArea(); };
  }
  function updateSeg() {
    $$('.seg button', w).forEach(b => b.classList.toggle('on', b.dataset.type === type));
    const x = type === 'xfer';
    $('#cat-area', w).style.display = x ? 'none' : '';
    $('#payee-label', w).innerHTML = x ? 'Omschrijving <span class="hint">optioneel</span>' : 'Begunstigde';
    f.payee.placeholder = x ? 'bijv. Maandelijks sparen' : 'Aan wie betaalde u, of wie betaalde u?';
    renderXferArea();
  }
  $$('.seg button', w).forEach(b => b.onclick = () => {
    const was = type; type = b.dataset.type;
    if (type === 'xfer') splits = null;
    if (was === 'xfer' && type !== 'xfer') renderCatArea();
    if (curSel.startsWith('t:')) curSel = '';
    updateSeg(); updateSplitSum();
  });

  async function handleNewCat(sel, onDone) {
    const name = await promptBox('Nieuwe categorie', 'Naam van de categorie', '', 'Gebruik “Eten : Boodschappen” voor een subcategorie');
    if (name) {
      const r = findOrCreateCategory(name, type === 'pay' ? 'expense' : 'income');
      changed(); onDone('c:' + r.cat.id);
    } else onDone(null);
  }

  function renderCatArea() {
    const el = $('#cat-area', w);
    if (!splits) {
      el.innerHTML = `<label>Categorie<div class="row"><select name="cat">${catOptions(curSel, acctId, { noTransfers: !curSel.startsWith('t:') })}</select><button type="button" class="btn small" data-split title="Deze transactie over meerdere categorieën verdelen">Splitsen…</button></div></label>`;
      const sel = $('select[name=cat]', el);
      sel.onchange = () => {
        if (sel.value === '__new') handleNewCat(sel, v => { if (v) curSel = v; renderCatArea(); });
        else curSel = sel.value;
      };
      $('[data-split]', el).onclick = () => {
        const a = parseUserAmount(f.amount.value);
        splits = [{ sel: curSel, memo: '', amt: a != null ? moneyPlain(Math.abs(a)) : '' }, { sel: '', memo: '', amt: '' }];
        renderCatArea();
      };
    } else {
      el.innerHTML = `<div style="font-size:14px;font-weight:550;margin-bottom:4px">Verdelen over categorieën</div>
        <table class="splits"><tbody>${splits.map((s, i) => `<tr>
          <td style="width:45%"><select data-si="${i}" data-f="sel">${catOptions(s.sel, acctId)}</select></td>
          <td><input data-si="${i}" data-f="memo" value="${esc(s.memo)}" placeholder="Notitie"></td>
          <td class="amt"><input data-si="${i}" data-f="amt" value="${esc(s.amt)}" inputmode="decimal" placeholder="0${localeDecimal()}00"></td>
          <td><button type="button" class="icon-btn" data-rm="${i}" aria-label="Regel verwijderen">×</button></td></tr>`).join('')}</tbody></table>
        <div class="splitsum"><button type="button" class="btn small" data-addline>+ Regel toevoegen</button><button type="button" class="btn small" data-fill>Rest op de laatste regel zetten</button><button type="button" class="btn small" data-unsplit>Splitsen ongedaan maken</button><span id="splitsum"></span></div>`;
      $$('[data-si]', el).forEach(inp => {
        const ev = inp.tagName === 'SELECT' ? 'change' : 'input';
        inp.addEventListener(ev, () => {
          const i = +inp.dataset.si, fld = inp.dataset.f;
          if (fld === 'sel' && inp.value === '__new') { handleNewCat(inp, v => { if (v) splits[i].sel = v; renderCatArea(); }); return; }
          splits[i][fld] = inp.value; updateSplitSum();
        });
      });
      $$('[data-rm]', el).forEach(b => b.onclick = () => { splits.splice(+b.dataset.rm, 1); if (!splits.length) splits = null; renderCatArea(); });
      $('[data-addline]', el).onclick = () => { splits.push({ sel: '', memo: '', amt: '' }); renderCatArea(); };
      $('[data-unsplit]', el).onclick = () => { curSel = splits[0] ? splits[0].sel : ''; splits = null; renderCatArea(); };
      $('[data-fill]', el).onclick = () => {
        const total = parseUserAmount(f.amount.value);
        if (total == null) return;
        const others = splits.slice(0, -1).reduce((s, x) => s + (parseUserAmount(x.amt) || 0), 0);
        splits[splits.length - 1].amt = moneyPlain(Math.abs(total) - others); renderCatArea();
      };
      updateSplitSum();
    }
  }
  function updateSplitSum() {
    const el = $('#splitsum', w); if (!el || !splits) return;
    const sum = splits.reduce((s, x) => s + (parseUserAmount(x.amt) || 0), 0);
    const total = parseUserAmount(f.amount.value);
    if (total == null) { el.innerHTML = `Regels samen ${esc(money(sum))}`; return; }
    const left = Math.abs(total) - sum;
    el.innerHTML = left === 0 ? `<span style="color:var(--pos)">✓ De regels tellen op tot het bedrag</span>` : `Nog te verdelen: <b class="${left < 0 ? 'neg' : ''}">${esc(money(left))}</b>`;
  }
  f.amount.addEventListener('input', updateSplitSum);
  renderCatArea();
  updateSeg();

  // auto-fill from the last transaction with this payee (like Money did)
  if (isNew) f.payee.addEventListener('change', () => {
    const last = idx().payeeLast.get(f.payee.value.trim().toLowerCase());
    if (!last || f.amount.value) return;
    f.amount.value = moneyPlain(Math.abs(last.amount));
    if (type === 'xfer' || (last.transferAccountId && !(last.splits && last.splits.length))) {
      if (last.transferAccountId) {
        type = 'xfer'; splits = null; curSel = '';
        xferFrom = last.amount < 0 ? last.accountId : last.transferAccountId;
        xferTo = last.amount < 0 ? last.transferAccountId : last.accountId;
      }
      updateSeg(); f.amount.select(); return;
    }
    type = last.amount > 0 ? 'dep' : 'pay'; updateSeg();
    if (last.splits && last.splits.length) {
      const s = last.amount > 0 ? 1 : -1;
      splits = last.splits.map(x => ({ sel: x.transferAccountId ? 't:' + x.transferAccountId : x.categoryId ? 'c:' + x.categoryId : '', memo: x.memo || '', amt: moneyPlain(x.amount * s) }));
    } else { splits = null; curSel = last.transferAccountId ? (last.transferAccountId === acctId ? '' : 't:' + last.transferAccountId) : last.categoryId ? 'c:' + last.categoryId : ''; }
    renderCatArea();
    f.amount.select();
  });

  function save() {
    err.textContent = '';
    const date = f.date.value;
    if (!date) { err.textContent = 'Vul een datum in.'; return false; }
    let amt = parseUserAmount(f.amount.value);
    let outSplits = null;
    if (splits) {
      const lines = splits.map(s => ({ sel: s.sel, memo: s.memo.trim(), v: parseUserAmount(s.amt) })).filter(s => s.v);
      if (!lines.length) { err.textContent = 'Vul op ten minste één regel een bedrag in.'; return false; }
      const sum = lines.reduce((s, x) => s + x.v, 0);
      if (amt == null) { amt = sum; f.amount.value = moneyPlain(sum); }
      if (sum !== Math.abs(amt)) { err.textContent = `De regels tellen op tot ${money(sum)}, maar het bedrag is ${money(Math.abs(amt))}. Pas een regel aan of gebruik “Rest op de laatste regel zetten”.`; return false; }
      if (lines.length === 1) { curSel = lines[0].sel; }
      else outSplits = lines.map(l => ({ categoryId: l.sel.startsWith('c:') ? l.sel.slice(2) : null, transferAccountId: l.sel.startsWith('t:') ? l.sel.slice(2) : null, memo: l.memo, amount: l.v * sgn() }));
    }
    if (amt == null) { err.textContent = 'Vul een bedrag in.'; f.amount.focus(); return false; }
    if (amt === 0 && !d.ob) { err.textContent = 'Het bedrag kan niet nul zijn.'; return false; }
    if (type === 'xfer') {
      if (!xferFrom || !xferTo) { err.textContent = 'Kies beide rekeningen voor de overboeking.'; return false; }
      if (xferFrom === xferTo) { err.textContent = 'De twee rekeningen van een overboeking moeten verschillend zijn.'; return false; }
    }
    const fields = type === 'xfer' ? {
      accountId: xferFrom, date, amount: -Math.abs(amt), payee: f.payee.value.trim(), memo: f.memo.value.trim(), num: f.num.value.trim(), status: f.status.value,
      splits: null, categoryId: null, transferAccountId: xferTo,
    } : {
      accountId: acctId, date, amount: Math.abs(amt) * sgn(), payee: f.payee.value.trim(), memo: f.memo.value.trim(), num: f.num.value.trim(), status: f.status.value,
      splits: outSplits, categoryId: !outSplits && curSel.startsWith('c:') ? curSel.slice(2) : null, transferAccountId: !outSplits && curSel.startsWith('t:') ? curSel.slice(2) : null,
    };
    let t;
    if (isNew) t = newTx(fields); else { t = DB.transactions.find(x => x.id === src.id); Object.assign(t, fields); }
    syncLegs(t);
    lastEnteredDate = date;
    changed();
    return true;
  }
  f.onsubmit = e => { e.preventDefault(); if (save()) { closeModal(w); render(); } };
  const sn = $('[data-savenew]', w);
  if (sn) sn.onclick = () => { if (save()) { const keepType = type; closeModal(w); render(); openTxEditor(null, viewAcc, keepType); } };
  const del = $('[data-del]', w);
  if (del) del.onclick = async () => {
    const hasLegs = (idx().legsOf.get(src.id) || []).length;
    if (!await confirmBox('Deze transactie verwijderen?', hasLegs ? '<p>Dit is een overboeking; hij wordt uit beide rekeningen verwijderd.</p>' : '<p>Dit kan niet ongedaan worden gemaakt.</p>', 'Verwijderen', true)) return;
    deleteTx(src); changed(); closeModal(w); render();
  };
}

/* ---------- Account editor ---------- */
function openAccountEditor(acc) {
  const isNew = !acc;
  const a = acc || { name: '', type: 'checking', note: '', closed: false };
  const n = acc ? (idx().byAcc.get(acc.id) || []).length : 0;
  const w = openModal({
    title: isNew ? 'Rekening toevoegen' : 'Rekeninggegevens', body: `<form autocomplete="off">
    <label>Naam van de rekening<input name="name" value="${esc(a.name)}" required autofocus placeholder="bijv. ING betaalrekening"></label>
    <label>Soort rekening<select name="type">${ACCOUNT_TYPES.map(([k, l]) => `<option value="${k}" ${a.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    ${isNew ? `<div class="grid2"><label>Saldo nu <span class="hint" id="obhint">wat er nu op de rekening staat</span><input name="ob" inputmode="decimal" placeholder="0${localeDecimal()}00"></label>
      <label>Op datum<input type="date" name="obdate" value="${todayISO()}"></label></div>` : ''}
    <label>Opmerking <span class="hint">optioneel (rekeningnummer, bank, …)</span><input name="note" value="${esc(a.note || '')}"></label>
    ${!isNew ? `<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="closed" ${a.closed ? 'checked' : ''} style="width:auto;min-height:0"> Deze rekening is opgeheven (niet meer in de lijst tonen)</label>` : ''}
    <div class="err"></div>
    <div class="modal-actions">${!isNew ? '<button type="button" class="btn danger" data-del>Rekening verwijderen</button>' : ''}<span class="spacer"></span><button type="button" class="btn" data-close>Annuleren</button><button class="btn primary">${isNew ? 'Rekening toevoegen' : 'Opslaan'}</button></div>
  </form>`
  });
  const f = $('form', w);
  const upHint = () => { const h = $('#obhint', w); if (h) h.textContent = isDebtType(f.type.value) ? 'het bedrag dat u nu verschuldigd bent' : 'wat er nu op de rekening staat'; };
  f.type.onchange = upHint; upHint();
  f.onsubmit = e => {
    e.preventDefault();
    const name = f.name.value.trim();
    if (!name) { $('.err', w).textContent = 'Vul een naam in.'; return; }
    if (DB.accounts.some(x => x !== acc && x.name.toLowerCase() === name.toLowerCase())) { $('.err', w).textContent = 'Er is al een rekening met deze naam.'; return; }
    if (isNew) {
      const na = { id: uid(), name, type: f.type.value, note: f.note.value.trim(), closed: false };
      DB.accounts.push(na);
      let ob = parseUserAmount(f.ob.value) || 0;
      if (isDebtType(na.type)) ob = -Math.abs(ob);
      if (ob) newTx({ accountId: na.id, date: f.obdate.value || todayISO(), amount: ob, payee: 'Beginsaldo', ob: true, status: 'R' });
      changed(); closeModal(w); go('account', { accountId: na.id });
    } else {
      Object.assign(acc, { name, type: f.type.value, note: f.note.value.trim(), closed: f.closed.checked });
      changed(); closeModal(w); render();
    }
  };
  const del = $('[data-del]', w);
  if (del) del.onclick = async () => {
    if (!await confirmBox('“' + acc.name + '” verwijderen?', `<p>Hiermee verwijdert u de rekening${n ? ` en de <b>${n.toLocaleString('nl-NL')}</b> transacties` : ''}. Overboekingen vanaf andere rekeningen naar deze rekening blijven bij die rekeningen staan, maar krijgen geen categorie.</p><p>Gebruikt u de rekening alleen niet meer, dan kunt u hem beter markeren als <b>opgeheven</b>.</p>`, 'Rekening verwijderen', true)) return;
    const gone = new Set(DB.transactions.filter(t => t.accountId === acc.id).map(t => t.id));
    DB.transactions = DB.transactions.filter(t => !gone.has(t.id) && !(t.linkId && gone.has(t.linkId)));
    for (const t of DB.transactions) {
      if (t.transferAccountId === acc.id && !t.linkId) t.transferAccountId = null;
      if (t.splits) for (const s of t.splits) if (s.transferAccountId === acc.id) s.transferAccountId = null;
    }
    DB.accounts = DB.accounts.filter(x => x !== acc);
    changed(); closeModal(w); go('home');
  };
}

/* ---------- Reconcile ---------- */
function startReconcile() {
  const a = idx().acc.get(state.accountId); if (!a) return;
  const debt = isDebtType(a.type);
  const prev = a.lastStatement;
  const w = openModal({
    title: esc(a.name) + ' afstemmen', body: `<form>
    <p class="sub" style="margin-top:0">Vergelijk Kasboek met een afschrift van uw bank. ${prev ? `De vorige keer hebt u afgestemd tot ${fmtDate(prev.date)} met een saldo van ${esc(money(prev.balance))}.` : ''}</p>
    <div class="grid2"><label>Datum afschrift<input type="date" name="date" value="${todayISO()}" required></label>
    <label>${debt ? 'Verschuldigd bedrag op het afschrift' : 'Eindsaldo op het afschrift'}<input name="bal" inputmode="decimal" autofocus placeholder="0${localeDecimal()}00"></label></div>
    <div class="err"></div>
    <div class="modal-actions"><span class="spacer"></span><button type="button" class="btn" data-close>Annuleren</button><button class="btn primary">Beginnen</button></div></form>`
  });
  const f = $('form', w);
  f.onsubmit = e => {
    e.preventDefault();
    let v = parseUserAmount(f.bal.value);
    if (v == null) { $('.err', w).textContent = 'Vul het saldo in dat op het afschrift staat.'; return; }
    if (debt) v = -Math.abs(v);
    const all = idx().byAcc.get(a.id) || [];
    recon = { accountId: a.id, date: f.date.value, ending: v, checked: new Set(all.filter(t => t.status === 'c' && t.date <= f.date.value).map(t => t.id)) };
    closeModal(w); render();
  };
}
function finishReconcile(mode) {
  const a = idx().acc.get(recon.accountId);
  const all = idx().byAcc.get(a.id) || [];

function spendingRows(flows, drill, kind) {
  kind = kind || 'expense';
  const sign = kind === 'expense' ? -1 : 1;
  const I = idx();
  const m = new Map();
  for (const [k, v] of flows) {
    if (catKind(k) !== kind) continue;

    else {

function yearFlows(year, accountId) {

  const y = String(year);

    if (accountId !== 'all' && t.accountId !== accountId) continue;
    const mi = +t.date.slice(5, 7) - 1;

    else if (!t.transferAccountId) add(t.categoryId || (t.amount > 0 ? '_in' : '_out'), mi, t.amount);

}
function yearRows(year, accountId, showSubs) {

  const nz = a => a.some(v => v);

  for (const kind of ['income', 'expense']) {
    const sign = kind === 'expense' ? -1 : 1;

    let tot = zero();
    for (const top of sortedTopCats(kind)) {
      const subs = (I.childrenOf.get(top.id) || []).map(c => ({ c, v: val(c.id) })).filter(x => nz(x.v));
      const own = val(top.id);
      const all = subs.reduce((a, x) => sum(a, x.v), own);
      if (!nz(all)) continue;
      tot = sum(tot, all);
      if (showSubs && subs.length) {
        out[kind].push({ label: top.name, v: all, level: 0, group: true, ids: [top.id, ...(I.childrenOf.get(top.id) || []).map(c => c.id)] });
        if (nz(own)) out[kind].push({ label: top.name + ' (algemeen)', v: own, level: 1, ids: [top.id] });

    }

}

   QIF import (Microsoft Money export)
   =================================================================== */
let importPlan = null;
function decodeBytes(buf) { try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { return new TextDecoder('windows-1252').decode(buf); } }

function parseQIF(text) {
  const lines = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
  const sections = [];
  let mode = null, rec = {}, sec = null, curAcct = null;
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line) continue;
    if (line[0] === '!') {
      const h = line.slice(1).trim(), hl = h.toLowerCase();
      if (hl.startsWith('option:') || hl.startsWith('clear:')) continue;
      if (hl === 'account') { mode = 'account'; rec = {}; continue; }
      if (hl.startsWith('type:')) { mode = 'type'; sec = { type: h.slice(5).trim(), account: curAcct, records: [] }; sections.push(sec); rec = {}; continue; }
      mode = 'skip'; continue;
    }
    if (mode === 'account') {
      if (line[0] === '^') { curAcct = { name: (rec.N || '').trim(), type: (rec.T || '').trim() }; rec = {}; }
      else rec[line[0]] = line.slice(1);
      continue;
    }
    if (mode === 'type') {
      if (line[0] === '^') { if (Object.keys(rec).length) sec.records.push(rec); rec = {}; continue; }
      const c = line[0], v = line.slice(1);
      if (c === 'S' || c === 'E' || c === '$') {
        rec.splits = rec.splits || [];
        let last = rec.splits[rec.splits.length - 1];
        if (c === 'S' || !last || (c in last)) { last = {}; rec.splits.push(last); }
        last[c] = v;
      } else if (!(c in rec)) rec[c] = v;
      else if (c === 'A' || c === 'M') rec[c] += ' ' + v;
    }
  }
  if (mode === 'type' && sec && Object.keys(rec).length) sec.records.push(rec);
  return sections;
}
function qifDateParts(s) {
  s = String(s || '').trim();
  const apos = s.indexOf("'") >= 0;
  let p = s.split(/[^0-9]+/).filter(Boolean);
  if (p.length === 1 && p[0].length === 8) p = [p[0].slice(0, 4), p[0].slice(4, 6), p[0].slice(6)];
  return { p, apos };
}
function detectDateOrder(dates) {
  let first12 = false, second12 = false, ymd = false;
  for (const d of dates) {
    const { p } = qifDateParts(d);
    if (p.length < 3) continue;
    if (p[0].length === 4) { ymd = true; continue; }
    if (+p[0] > 12) first12 = true;
    if (+p[1] > 12) second12 = true;
  }
  if (ymd) return 'YMD';
  if (first12 && !second12) return 'DMY';
  if (second12 && !first12) return 'MDY';
  return null;
}
function parseQifDate(s, order) {
  const { p, apos } = qifDateParts(s);
  if (p.length < 3) return null;
  let y, m, d;
  if (order === 'YMD' || p[0].length === 4) [y, m, d] = p.map(Number);
  else if (order === 'MDY') { m = +p[0]; d = +p[1]; y = +p[2]; }
  else { d = +p[0]; m = +p[1]; y = +p[2]; }
  if (String(p[2]).length <= 2 && !(order === 'YMD' || p[0].length === 4)) y = apos ? 2000 + y : (y < 50 ? 2000 + y : 1900 + y);
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y > 1900)) return null;
  return isoOf(y, m, d);
}
function detectDecimalComma(amounts) {
  let comma = 0, dot = 0;
  for (const a of amounts) { const s = String(a).trim(); if (/,\d{1,2}$/.test(s)) comma++; else if (/\.\d{1,2}$/.test(s)) dot++; }
  return comma > dot;
}
function parseQifAmount(s, comma) {
  s = String(s || '').trim().replace(/\s/g, '');
  if (!s) return null;
  s = comma ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  const v = Math.round(parseFloat(s) * 100);
  return isFinite(v) ? v : null;
}
function splitCatField(v) {
  v = String(v || '').trim();
  if (!v) return { cat: null, transfer: null };
  if (v[0] === '[') { const e = v.indexOf(']'); return { cat: null, transfer: v.slice(1, e > 0 ? e : undefined).trim() }; }
  const slash = v.indexOf('/');
  if (slash >= 0) v = v.slice(0, slash);
  return { cat: v.trim() || null, transfer: null };
}
const QIF_TX_TYPES = { 'bank': 'checking', 'cash': 'cash', 'ccard': 'credit', 'oth a': 'asset', 'oth l': 'liability' };
function qifAcctType(t) { return QIF_TX_TYPES[String(t || '').toLowerCase()] || 'checking'; }

async function readQifFiles(files) {
  const plan = { files: [] };
  for (const file of files) {
    const text = decodeBytes(await file.arrayBuffer());
    const sections = parseQIF(text);
    const groups = new Map();
    const cats = [];
    let invst = 0, other = 0;
    for (const s of sections) {
      const tl = s.type.toLowerCase();
      if (tl === 'cat') { for (const r of s.records) if (r.N) cats.push({ name: r.N, kind: ('I' in r) ? 'income' : 'expense' }); continue; }
      if (tl === 'invst') { invst += s.records.length; continue; }
      if (!(tl in QIF_TX_TYPES)) { other += s.records.length; continue; }
      const key = s.account && s.account.name ? s.account.name.toLowerCase() : '__unnamed';
      if (!groups.has(key)) groups.set(key, { qifName: s.account && s.account.name || null, qifType: s.type, records: [] });
      groups.get(key).records.push(...s.records);
    }
    const allRecs = Array.from(groups.values()).flatMap(g => g.records);
    const dates = allRecs.map(r => r.D).filter(Boolean);
    const amounts = allRecs.flatMap(r => [r.T || r.U, ...(r.splits || []).map(s => s.$)]).filter(Boolean);
    const detected = detectDateOrder(dates);
    const base = file.name.replace(/\.qif$/i, '');
    const accounts = Array.from(groups.values()).map(g => {
      // Money's export starts with an "Opening Balance" line that names the account itself: L[Account name]
      let guess = g.qifName;
      if (!guess) { const ob = g.records.find(r => /opening balance|beginsaldo|openingssaldo/i.test(r.P || '') && /^\[.+\]/.test(r.L || '')); if (ob) guess = splitCatField(ob.L).transfer; }
      const name = guess || base;
      const existing = DB.accounts.find(a => a.name.toLowerCase() === name.toLowerCase());
      const ds = g.records.map(r => r.D).filter(Boolean);
      return { qifName: name, type: qifAcctType(g.qifType), records: g.records, target: existing ? existing.id : 'new', newName: name, firstDate: ds[0], lastDate: ds[ds.length - 1] };
    });
    plan.files.push({ name: file.name, accounts, cats, invst, other, dateOrder: detected || (localeDecimal() === ',' ? 'DMY' : 'MDY'), detectedOrder: detected, comma: detectDecimalComma(amounts), sample: dates[0] || '' });
  }
  return plan;
}

function runImport(plan) {
  const st = { tx: 0, matched: 0, dupes: 0, newAccounts: [], autoAccounts: [], cats: 0, invst: 0, badDates: 0 };
  const before = DB.categories.length;
  // 1. categories with their income/expense type
  for (const f of plan.files) for (const c of f.cats) { const r = findOrCreateCategory(c.name, c.kind); }
  // 2. accounts chosen in the plan
  const nameMap = new Map();
  for (const f of plan.files) for (const g of f.accounts) {
    if (g.skip) continue;
    let id = g.target;
    if (id === 'new') {
      const nm = (g.newName || g.qifName || 'Geïmporteerde rekening').trim();
      let ex = DB.accounts.find(a => a.name.toLowerCase() === nm.toLowerCase());
      if (!ex) { ex = { id: uid(), name: nm, type: g.type, note: '', closed: false }; DB.accounts.push(ex); st.newAccounts.push(nm); }
      id = ex.id;
    }
    g._id = id;
    nameMap.set(String(g.qifName).toLowerCase(), id);
    nameMap.set(accName(id).toLowerCase(), id);
  }
  _idx = null;
  const resolveAcc = name => {
    const k = name.toLowerCase();
    if (nameMap.has(k)) return nameMap.get(k);
    let a = DB.accounts.find(x => x.name.toLowerCase() === k);
    if (!a) { a = { id: uid(), name, type: 'checking', note: '', closed: false }; DB.accounts.push(a); st.autoAccounts.push(name); }
    nameMap.set(k, a.id); return a.id;
  };
  const existingKeys = new Set(DB.transactions.filter(t => t.ik).map(t => t.ik));
  const statusOf = c => { c = String(c || '').trim().toUpperCase(); return c === '*' || c === 'C' ? 'c' : (c === 'X' || c === 'R') ? 'R' : ''; };
  const catIdFor = (path, amount) => path ? findOrCreateCategory(path, amount > 0 ? 'income' : 'expense').cat.id : null;

  for (const f of plan.files) {
    st.invst += f.invst;
    for (const g of f.accounts) {
      if (g.skip) continue;
      const acctId = g._id;
      const occ = new Map();
      for (const r of g.records) {
        const date = parseQifDate(r.D, f.dateOrder);
        if (!date) { st.badDates++; continue; }
        const amount = parseQifAmount(r.T != null ? r.T : r.U, f.comma) || 0;
        const payee = (r.P || '').trim(), memo = (r.M || '').trim(), num = (r.N || '').trim(), status = statusOf(r.C);
        const base = [acctId, date, amount, payee, num, memo].join('|');
        const n = (occ.get(base) || 0) + 1; occ.set(base, n);
        const ik = base + '|' + n;
        if (existingKeys.has(ik)) { st.dupes++; continue; }
        existingKeys.add(ik);
        const lf = splitCatField(r.L);
        const hasSplits = r.splits && r.splits.length > 1 || (r.splits && r.splits.length === 1 && r.splits[0].$ != null && parseQifAmount(r.splits[0].$, f.comma) !== amount);
        // opening balance: a transfer to the account itself
        if (!r.splits && lf.transfer && resolveAcc(lf.transfer) === acctId) {
          newTx({ accountId: acctId, date, amount, payee: payee || 'Beginsaldo', memo, num, status: status || 'R', ob: true, ik }); st.tx++; continue;
        }
        if (!hasSplits) {
          const single = r.splits && r.splits.length === 1 ? splitCatField(r.splits[0].S) : lf;
          if (single.transfer) {
            const other = resolveAcc(single.transfer);
            if (other !== acctId) {
              // the other side may already be here from an earlier file → match instead of duplicating
              const leg = DB.transactions.find(t => t.linkId && !t.ik && t.accountId === acctId && t.date === date && t.amount === amount && (idxTx(t.linkId) || {}).accountId === other);
              if (leg) { leg.ik = ik; if (status) leg.status = status; if (num) leg.num = num; if (memo && !leg.memo) leg.memo = memo; st.matched++; continue; }
              const t = newTx({ accountId: acctId, date, amount, payee, memo, num, status, transferAccountId: other, ik });
              syncLegs(t); st.tx++; continue;
            }
          }
          newTx({ accountId: acctId, date, amount, payee, memo, num, status, categoryId: catIdFor(single.cat, amount), ik }); st.tx++; continue;
        }
        // split transaction
        const t = newTx({ accountId: acctId, date, amount, payee, memo, num, status, ik, splits: [] });
        for (const s of r.splits) {
          const sf = splitCatField(s.S), sa = parseQifAmount(s.$, f.comma) || 0;
          const line = { categoryId: null, transferAccountId: null, memo: (s.E || '').trim(), amount: sa };
          if (sf.transfer) {
            const other = resolveAcc(sf.transfer);
            if (other !== acctId) {
              line.transferAccountId = other;
              // absorb a plain transfer already imported from the other account
              const ex = DB.transactions.find(x => !x.linkId && !x.splits && x.accountId === other && x.transferAccountId === acctId && x.date === date && x.amount === -sa && x.ik);
              if (ex) { line._absorb = { status: ex.status, num: ex.num, ik: ex.ik }; deleteTx(ex); st.matched++; }
            }
          } else line.categoryId = catIdFor(sf.cat, sa);
          t.splits.push(line);
        }
        _idx = null;
        syncLegs(t);
        t.splits.forEach((s, i) => { if (s._absorb) { const leg = DB.transactions.find(x => x.linkId === t.id && x.linkKey === i); if (leg) Object.assign(leg, s._absorb); delete s._absorb; } });
        st.tx++;
      }
    }
  }
  st.cats = DB.categories.length - before;
  changed();
  return st;
}
function idxTx(id) { return DB.transactions.find(t => t.id === id); }

/* ---------- Example data ---------- */
function makeSample() {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const between = (a, b) => Math.round((a + rnd() * (b - a)) * 100);
  const keep = DB.settings;
  DB = emptyDB(); DB.settings = keep;
  const A = (name, type, note) => { const a = { id: uid(), name, type, note: note || '', closed: false }; DB.accounts.push(a); return a.id; };
  const chk = A('Betaalrekening', 'checking'), sav = A('Spaarrekening', 'savings'), cc = A('Creditcard', 'credit'), cash = A('Kas', 'cash');
  const C = (p, k) => findOrCreateCategory(p, k).cat.id;
  const cat = {
    salary: C('Salaris', 'income'), interest: C('Rente', 'income'), mort: C('Wonen : Hypotheek', 'expense'), energy: C('Vaste lasten : Energie'), water: C('Vaste lasten : Water'), net: C('Vaste lasten : Internet & telefoon'),
    groc: C('Eten : Boodschappen'), dine: C('Eten : Uit eten'), fuel: C('Auto : Brandstof'), carins: C('Auto : Verzekering'), health: C('Verzekeringen : Zorg'), home: C('Verzekeringen : Woning'), cloth: C('Kleding'),
    gifts: C('Cadeaus'), hol: C('Vakanties'), books: C('Vrije tijd : Boeken & muziek'), cult: C('Vrije tijd : Cultuur'), pharm: C('Gezondheid : Drogist'), tax: C('Belastingen : Gemeente'),
  };
  const now = todayISO().slice(0, 7);
  const start = addMonths(now, -23);
  const st = date => { const ago = monthsBetween(date.slice(0, 7), now).length - 1; return ago >= 2 ? 'R' : ago === 1 ? 'c' : ''; };
  const T = (acc, date, amount, payee, catId, extra) => { if (date > todayISO()) return null; const t = newTx(Object.assign({ accountId: acc, date, amount, payee, categoryId: catId || null, status: st(date) }, extra || {})); if (t.transferAccountId || t.splits) syncLegs(t); return t; };
  newTx({ accountId: chk, date: start + '-01', amount: 245000, payee: 'Beginsaldo', ob: true, status: 'R' });
  newTx({ accountId: sav, date: start + '-01', amount: 1200000, payee: 'Beginsaldo', ob: true, status: 'R' });
  newTx({ accountId: cash, date: start + '-01', amount: 6000, payee: 'Beginsaldo', ob: true, status: 'R' });
  let ccOwed = 0;
  for (const m of monthsBetween(start, now)) {
    const [y, mo] = m.split('-').map(Number);
    const d = n => isoOf(y, mo, n);
    T(chk, d(1), -118000, 'Rabobank Hypotheken', cat.mort);
    T(chk, d(3), -16500 - between(0, 30), 'Vattenfall', cat.energy);
    T(chk, d(8), -5450, 'KPN', cat.net);
    if (mo % 3 === 1) T(chk, d(9), -6200, 'Vitens', cat.water);
    T(chk, d(12), -14290, 'Zilveren Kruis', cat.health);
    T(chk, d(14), -2875, 'Centraal Beheer', null, { splits: [{ categoryId: cat.home, transferAccountId: null, memo: 'Woonverzekering', amount: -1850 }, { categoryId: cat.carins, transferAccountId: null, memo: 'Autoverzekering', amount: -1025 }] });
    if (mo === 3) T(chk, d(28), -38600, 'Gemeente Nijmegen', cat.tax, { memo: 'Gemeentelijke belastingen' });
    for (let w = 0; w < 4; w++) T(chk, d(2 + w * 7), -between(48, 135), rnd() < .6 ? 'Albert Heijn' : 'Jumbo', cat.groc);
    for (let k = 0; k < 2; k++) T(chk, d(5 + k * 12), -between(55, 85), 'Shell', cat.fuel);
    if (rnd() < .5) T(chk, d(17), -between(8, 35), 'Kruidvat', cat.pharm);
    T(chk, d(25), 345000, 'Radboud Universiteit', cat.salary, { memo: 'Salaris' });
    if (mo === 5) T(chk, d(25), 268000, 'Radboud Universiteit', cat.salary, { memo: 'Vakantiegeld' });
    T(chk, d(26), -40000, 'Maandelijks sparen', null, { transferAccountId: sav });
    T(chk, d(6), -10000, 'Geldautomaat', null, { transferAccountId: cash });
    for (let k = 0; k < 3; k++) T(cash, d(7 + k * 6), -between(6, 28), ['Bakker Bart', 'Markt', 'Café De Plak'][k], k === 2 ? cat.dine : cat.groc);
    if (ccOwed > 0) { T(chk, d(15), -ccOwed, 'Afschrijving creditcard', null, { transferAccountId: cc }); }
    ccOwed = 0;
    const buys = [['Bol.com', cat.books, 15, 60], ['Restaurant De Hemel', cat.dine, 45, 120], ['H&M', cat.cloth, 30, 110], ['Stadsschouwburg', cat.cult, 40, 90]];
    for (const [p, c, lo, hi] of buys) { if (rnd() < .7) { const t = T(cc, d(4 + Math.floor(rnd() * 22)), -between(lo, hi), p, c); if (t) ccOwed += -t.amount; } }
    if (mo === 7) { const t = T(cc, d(10), -164500, 'Booking.com', cat.hol, { memo: 'Zomervakantie' }); if (t) ccOwed += 164500; }
    if (mo === 12) { const t = T(cc, d(15), -between(150, 260), 'Cadeaus', cat.gifts); if (t) ccOwed += -t.amount; T(sav, d(31), between(90, 140), 'Rente', cat.interest); }
  }
  _idx = null; changed();
}

    return render();
  }
  if (d.rdrill != null) { reportState.drill = d.rdrill || null; reportState.drill2 = null; return render(); }
  if (d.catSub) { const p = idx().cat.get(d.catSub); const n = await promptBox('Nieuwe subcategorie van ' + p.name, 'Naam', ''); if (n) { findOrCreateCategory(p.name + ':' + n.replace(/:/g, ' '), p.kind); changed(); render(); } return; }
  if (d.catRen) {
    const c = idx().cat.get(d.catRen); const n = await promptBox('Categorie hernoemen', 'Nieuwe naam', c.name);
    if (n) { const clash = DB.categories.find(x => x !== c && x.parentId === c.parentId && x.name.toLowerCase() === n.toLowerCase()); if (clash) return alertBox('Naam al in gebruik', 'Een andere categorie heeft deze naam al. Om ze samen te voegen verwijdert u er één en verplaatst u de transacties naar de andere.'); c.name = n.replace(/:/g, ' '); changed(); render(); } return;
  }
  if (d.catKind) { const c = idx().cat.get(d.catKind); c.kind = c.kind === 'expense' ? 'income' : 'expense'; for (const s of (idx().childrenOf.get(c.id) || [])) s.kind = c.kind; changed(); render(); return; }
  if (d.catDel) return deleteCategory(d.catDel);
  switch (d.act) {
    case 'add-account': return openAccountEditor(null);
    case 'edit-account': return openAccountEditor(idx().acc.get(state.accountId));
    case 'new-tx': return openTxEditor(null, state.accountId);
    case 'new-tx-any': {
      const accs = DB.accounts.filter(a => !a.closed);
      if (accs.length === 1) return openTxEditor(null, accs[0].id);
      const w = openModal({ title: 'Welke rekening?', body: `<div class="cards" style="gap:6px">${accs.map(a => `<button class="bigbtn" data-pick="${a.id}" style="padding:10px 14px"><b style="margin:0">${esc(a.name)}</b></button>`).join('')}</div>` });
      $$('[data-pick]', w).forEach(b => b.onclick = () => { closeModal(w); openTxEditor(null, b.dataset.pick); });
      return;
    }
    case 'show-more': regState.shown += 500; return render();
    case 'reg-csv': return exportRegisterCSV();
    case 'report-csv': if (reportState._csv) downloadCSV('Kasboek rapport ' + todayISO() + '.csv', reportState._csv); return;
    case 'print': return window.print();
    case 'recon-start': return startReconcile();
    case 'recon-finish': return finishReconcile('finish');
    case 'recon-postpone': return finishReconcile('postpone');
    case 'recon-cancel': recon = null; return render();
    case 'recon-adjust': {
      const all = idx().byAcc.get(recon.accountId) || [];
      const cleared = all.filter(t => t.status === 'R').reduce((s, t) => s + t.amount, 0) + all.filter(t => recon.checked.has(t.id)).reduce((s, t) => s + t.amount, 0);
      const diff = recon.ending - cleared;
      if (!await confirmBox('Afronden met een correctie?', `<p>Kasboek en uw afschrift verschillen <b>${esc(money(diff))}</b>. Kasboek kan een transactie “Saldocorrectie” van dat bedrag toevoegen, zodat de rekening klopt met het afschrift.</p><p>Meestal is het beter eerst de ontbrekende of verkeerd ingevoerde transactie te zoeken.</p>`, 'Correctie toevoegen en afronden')) return;
      const t = newTx({ accountId: recon.accountId, date: recon.date, amount: diff, payee: 'Saldocorrectie', memo: 'Toegevoegd bij afstemmen', status: '' });
      recon.checked.add(t.id); _idx = null;
      return finishReconcile('finish');
    }
    case 'install': return installApp();
    case 'do-update': return applyUpdate();
    case 'fs-create': return createSharedFile();
    case 'fs-open': return openSharedFile();
    case 'fs-reconnect': return reconnectFile();
    case 'fs-sync': if (fileStatus === 'error') fileStatus = 'ok'; await syncFile(); return render();
    case 'fs-stop': return stopSharedFile();
    case 'fs-merge': return mergeOtherFile();
    case 'save-backup': return saveBackup();
    case 'open-backup': return openBackup();
    case 'sample': makeSample(); return go('home');
    case 'pick-qif': $('#file-qif').value = ''; return $('#file-qif').click();
    case 'imp-cancel': importPlan = null; return render();
    case 'imp-run': {
      const st = runImport(importPlan); importPlan = null;
      go('home');
      alertBox('Importeren voltooid', `<p><b>${st.tx.toLocaleString('nl-NL')}</b> transacties geïmporteerd${st.matched ? `, <b>${st.matched.toLocaleString('nl-NL')}</b> overboekingen gekoppeld aan de andere rekening` : ''}.</p>
        ${st.newAccounts.length ? `<p>Nieuwe rekeningen: ${st.newAccounts.map(esc).join(', ')}.</p>` : ''}
        ${st.autoAccounts.length ? `<p>Deze rekeningen kwamen alleen voor in overboekingen en zijn daarom aangemaakt met alleen die overboekingen: <b>${st.autoAccounts.map(esc).join(', ')}</b>. Importeer ook hun eigen QIF-bestanden om ze compleet te maken.</p>` : ''}
        ${st.cats ? `<p>${st.cats} categorieën aangemaakt.</p>` : ''}
        ${st.dupes ? `<p>${st.dupes.toLocaleString('nl-NL')} transacties stonden al in Kasboek en zijn overgeslagen.</p>` : ''}
        ${st.badDates ? `<p class="neg">${st.badDates} transacties hadden een onleesbare datum en zijn overgeslagen.</p>` : ''}
        ${st.invst ? `<p class="muted">${st.invst} beleggingstransacties zijn overgeslagen.</p>` : ''}
        <p>Tip: vergelijk het saldo van elke rekening met Money of uw bank en sla daarna een reservekopie op.</p>`);
      return;
    }
    case 'cat-add': {
      const n = await promptBox('Nieuwe categorie', 'Naam van de categorie', '', 'Gebruik “Eten : Boodschappen” voor een subcategorie');
      if (!n) return;
      const isInc = await confirmBox('Inkomsten of uitgaven?', `<p>Is “${esc(n)}” een categorie voor <b>inkomsten</b>? Kies Annuleren voor een categorie voor uitgaven.</p>`, 'Inkomsten');
      findOrCreateCategory(n, isInc ? 'income' : 'expense'); changed(); return render();
    }
    case 'erase': {
      if (!await confirmBox('Alle gegevens wissen?', fileHandle && fileStatus === 'ok' ? '<p><b>U gebruikt een gedeeld gegevensbestand.</b> Hiermee verwijdert u alle rekeningen, categorieën en transacties uit dat bestand, dus ook op de andere computer. Reservekopieën die u hebt opgeslagen blijven bestaan.</p>' : '<p>Hiermee verwijdert u alle rekeningen, categorieën en transacties uit Kasboek op deze computer. Reservekopieën die u hebt opgeslagen blijven bestaan.</p>', 'Alles wissen', true)) return;
      const keep = DB.settings; DB = emptyDB(); DB.settings = keep; changed(); return go('home');
    }
  }
});
$('#file-qif').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []); if (!files.length) return;
  try { importPlan = await readQifFiles(files); } catch (err) { importPlan = null; alertBox('Het bestand kan niet worden gelezen', esc(err.message)); }
  if (importPlan && !importPlan.files.some(f => f.accounts.length)) { alertBox('Niets om te importeren', 'Er zijn geen bank-, contant- of creditcardtransacties gevonden. Zijn dit QIF-bestanden die uit Money zijn geëxporteerd?'); importPlan = null; }
  render();
});

/* ---------- start ---------- */
(async function start() {
  const d = await loadData();
  if (d) { DB = Object.assign(emptyDB(), d); DB.settings = Object.assign(emptyDB().settings, d.settings || {}); }
  applyTheme();
  if (fileHandle) {
    try { fileStatus = (await fileHandle.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'needs-permission'; }
    catch (e) { fileStatus = 'needs-permission'; }
  }
  render();
  if (fileHandle && fileStatus === 'ok') syncFile();
  setInterval(checkForOtherComputer, 15000);
  checkForUpdate(); setInterval(checkForUpdate, 30 * 60000);
  window.addEventListener('focus', checkForUpdate);
  window.addEventListener('focus', checkForOtherComputer);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForOtherComputer(); });
})();
</script>
</body>
